<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amor Intencional - Gestión de Invitados</title>
    <!-- Librerías Externas via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @keyframes scan { 0%, 100% { top: 0; } 50% { top: 100%; } }
        .scan-line { animation: scan 2s ease-in-out infinite; }
        body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; overflow-x: hidden; }
        .icon-container { display: inline-flex; align-items: center; justify-content: center; pointer-events: none !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        .notification-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .notification-fade-out { animation: fadeOut 0.5s ease-in forwards; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -20px); } to { opacity: 1; transform: translate(-50%, 0); } }
        @keyframes fadeOut { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -10px); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        const Icon = ({ name, size = 18, className = "" }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current) {
                    containerRef.current.innerHTML = `<i data-lucide="${name}" style="width: ${size}px; height: ${size}px"></i>`;
                    lucide.createIcons({ targets: containerRef.current.querySelectorAll('[data-lucide]') });
                }
            }, [name, size]);
            return <span ref={containerRef} className={`icon-container ${className}`}></span>;
        };

        function App() {
            const [data, setData] = useState(() => {
                try {
                    const saved = localStorage.getItem('guestData_amor_intencional_v2');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });
            
            const [view, setView] = useState('list');
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedGuest, setSelectedGuest] = useState(null);
            const [scannerResult, setScannerResult] = useState(null);
            
            // Modales y Notificaciones
            const [confirmModal, setConfirmModal] = useState({ show: false, guest: null });
            const [manualValidateModal, setManualValidateModal] = useState({ show: false, guest: null });
            const [notification, setNotification] = useState({ show: false, title: '', message: '', type: 'success', exiting: false });
            
            // Credenciales Green API
            const [showApiConfig, setShowApiConfig] = useState(false);
            const [greenApiCreds, setGreenApiCreds] = useState({
                apiUrl: 'https://7107.api.greenapi.com',
                idInstance: '7107612995',
                apiTokenInstance: '7d7de44e19ed4fc9adeb6123cec112cde5f0c4764a304d9da4'
            });
            
            const [isSending, setIsSending] = useState(false);
            const [sendProgress, setSendProgress] = useState({ current: 0, total: 0, status: '' });
            const [showMassSendConfirm, setShowMassSendConfirm] = useState(false);
            
            const globalFileInputRef = useRef(null);
            const html5QrCodeRef = useRef(null);
            const isProcessingRef = useRef(false);

            useEffect(() => {
                localStorage.setItem('guestData_amor_intencional_v2', JSON.stringify(data));
            }, [data]);

            useEffect(() => {
                if (notification.show && !notification.exiting) {
                    const timer = setTimeout(() => {
                        setNotification(prev => ({ ...prev, exiting: true }));
                        setTimeout(() => {
                            setNotification(prev => ({ ...prev, show: false, exiting: false }));
                        }, 500);
                    }, 2000);
                    return () => clearTimeout(timer);
                }
            }, [notification.show, notification.exiting]);

            const triggerNotification = (title, message, type = 'success') => {
                setNotification({ show: true, title, message, type, exiting: false });
            };

            const stopScanner = useCallback(async () => {
                if (isProcessingRef.current) return;
                if (html5QrCodeRef.current && html5QrCodeRef.current.isScanning) {
                    isProcessingRef.current = true;
                    try { await html5QrCodeRef.current.stop(); } catch (err) {}
                    finally { isProcessingRef.current = false; }
                }
            }, []);

            const startScanner = async () => {
                if (isProcessingRef.current) return;
                const element = document.getElementById("reader");
                if (!element) return;
                isProcessingRef.current = true;
                try {
                    if (!html5QrCodeRef.current) html5QrCodeRef.current = new Html5Qrcode("reader");
                    if (html5QrCodeRef.current.isScanning) return;
                    await html5QrCodeRef.current.start(
                        { facingMode: "environment" },
                        { fps: 15, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 },
                        (text) => {
                            const idMatch = text.match(/AP\d{4}/);
                            const guestId = idMatch ? idMatch[0] : text;
                            const guest = data.find(g => g.id === guestId);
                            if (guest) setScannerResult(guest);
                        }
                    );
                } catch (err) {} finally { isProcessingRef.current = false; }
            };

            useEffect(() => {
                if (view === 'scanner' && !scannerResult) {
                    const t = setTimeout(startScanner, 200);
                    return () => { clearTimeout(t); stopScanner(); };
                } else stopScanner();
            }, [view, scannerResult, stopScanner]);

            const formatChatId = (phone) => {
                if (!phone) return null;
                let c = String(phone).replace(/\D/g, '');
                if (c.length === 10) c = '1' + c;
                return c.length >= 7 ? `${c}@c.us` : null;
            };

            const callGreenApi = async (guest) => {
                const { apiUrl, idInstance, apiTokenInstance } = greenApiCreds;
                if (!apiTokenInstance) throw new Error("Falta el Token de API.");
                const cleanUrl = apiUrl.replace(/\/+$/, "");
                const url = `${cleanUrl}/waInstance${idInstance}/sendFileByUrl/${apiTokenInstance}`;
                const caption = `*Bienvenidos a Amor Intencional* ✨\nSegunda Entrega\n\nNos llena de alegría contar con su presencia en esta experiencia especial dedicada al amor, la conexión y el crecimiento en pareja. 💛\n\n📅 *Fecha:* 15 de mayo\n🕖 *Hora:* 7:00 PM\n⛪ *Lugar:* Iglesia El Camino\n👫 *Pareja:* ${guest.nombre}\n🆔 *ID de acceso:* ${guest.id}\n\nGracias por ser parte de este encuentro.\n\n¡Les esperamos!`;
                const chatId = formatChatId(guest.contacto);
                if (!chatId) throw new Error("Número no válido.");
                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chatId, urlFile: guest.qrUrl, fileName: `qr_${guest.id}.png`, caption })
                    });
                    if (!res.ok) {
                        const errData = await res.json().catch(() => ({}));
                        throw new Error(errData.message || `Error ${res.status}`);
                    }
                    return true;
                } catch (e) { throw e; }
            };

            const handleSingleSend = async (guest) => {
                setConfirmModal({ show: false, guest: null });
                setIsSending(true);
                setSendProgress({ current: 1, total: 1, status: `Enviando a ${guest.nombre}...` });
                try {
                    await callGreenApi(guest);
                    triggerNotification('¡Enviado!', `Invitación enviada a ${guest.nombre}.`, 'success');
                } catch (e) {
                    triggerNotification('Error de API', e.message, 'error');
                } finally { setIsSending(false); }
            };

            const handleMassSend = async () => {
                setShowMassSendConfirm(false);
                setIsSending(true);
                let ok = 0;
                for (let i = 0; i < data.length; i++) {
                    setSendProgress({ current: i + 1, total: data.length, status: `Procesando ${data[i].nombre}...` });
                    try { await callGreenApi(data[i]); ok++; await new Promise(r => setTimeout(r, 2000)); } catch (e) {}
                }
                setIsSending(false);
                triggerNotification('Proceso Finalizado', `Éxito: ${ok} de ${data.length}.`, 'success');
            };

            const findValueInRow = (row, possibleNames) => {
                const keys = Object.keys(row);
                for (let name of possibleNames) {
                    const foundKey = keys.find(k => k.toLowerCase().trim() === name.toLowerCase());
                    if (foundKey) return row[foundKey];
                }
                return null;
            };

            const processFile = (file) => {
                const r = new FileReader();
                r.onload = (e) => {
                    try {
                        const wb = XLSX.read(e.target.result, { type: 'binary' });
                        const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                        const newData = raw.map((row, i) => {
                            const id = `AP${String(i + 1).padStart(4, '0')}`;
                            const n = findValueInRow(row, ['Nombre', 'Persona']) || 'Invitado';
                            const c = String(findValueInRow(row, ['Contacto', 'Telefono', 'Celular']) || '').trim();
                            const qrData = `ID: ${id}\nPersona: ${n}\nContacto: ${c}`;
                            return { id, nombre: n, contacto: c, status: 'No Validado',
                                     qrUrl: `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(qrData)}` };
                        });
                        setData(newData);
                        triggerNotification('Lista Cargada', `Se importaron ${newData.length} personas.`, 'success');
                    } catch (err) {
                        triggerNotification('Error de Archivo', 'No se pudo leer el Excel.', 'error');
                    } finally { if(globalFileInputRef.current) globalFileInputRef.current.value = ""; }
                };
                r.readAsBinaryString(file);
            };

            const validateGuest = (id) => {
                setData(prev => prev.map(g => g.id === id ? { ...g, status: 'Validado' } : g));
                setScannerResult(null);
                setManualValidateModal({ show: false, guest: null });
                triggerNotification('Validación Exitosa', 'El ingreso ha sido registrado.', 'success');
            };

            const filteredData = data.filter(g => g.nombre.toLowerCase().includes(searchTerm.toLowerCase()) || g.id.toLowerCase().includes(searchTerm.toLowerCase()));

            return (
                <div className="min-h-screen">
                    <input type="file" className="hidden" ref={globalFileInputRef} onChange={(e) => { if(e.target.files[0]) processFile(e.target.files[0]) }} accept=".xlsx, .xls" />

                    <nav className="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 h-16 px-4 flex items-center justify-between shadow-sm">
                        <div className="flex items-center space-x-2">
                            <div className="bg-rose-500 p-1.5 rounded-lg text-white shadow-md"><Icon name="heart" size={18} /></div>
                            <span className="hidden sm:block text-lg font-black tracking-tighter uppercase text-slate-800 leading-none">Amor Intencional</span>
                        </div>
                        <div className="flex bg-slate-100 p-1 rounded-2xl border border-slate-200">
                            <button onClick={() => setView('list')} className={`px-4 sm:px-5 py-1.5 rounded-xl text-[10px] sm:text-xs font-black transition-all ${view === 'list' ? 'bg-white shadow-sm text-rose-600' : 'text-slate-500'}`}>LISTADO</button>
                            <button onClick={() => setView('scanner')} className={`px-4 sm:px-5 py-1.5 rounded-xl text-[10px] sm:text-xs font-black transition-all ${view === 'scanner' ? 'bg-white shadow-sm text-rose-600' : 'text-slate-500'}`}>ESCÁNER</button>
                        </div>
                        <div className="flex items-center space-x-1">
                            {data.length > 0 && <button onClick={() => globalFileInputRef.current.click()} className="p-2 text-slate-400 hover:text-emerald-600 transition-colors" title="Cargar lista"><Icon name="upload" size={18}/></button>}
                            <button onClick={() => setShowApiConfig(true)} className="p-2 text-slate-400 hover:text-rose-600 transition-colors"><Icon name="settings" size={18}/></button>
                            {data.length > 0 && <button onClick={() => { if(window.confirm("¿Borrar lista?")) setData([]) }} className="p-2 text-slate-300 hover:text-red-500 transition-colors"><Icon name="trash-2" size={18}/></button>}
                        </div>
                    </nav>

                    <main className="max-w-6xl mx-auto px-4 py-8">
                        {data.length === 0 ? (
                            <div className="max-w-xl mx-auto mt-12 text-center p-12 border-4 border-dashed rounded-[3rem] bg-white border-slate-200 shadow-xl">
                                <div className="w-20 h-20 bg-rose-500 rounded-3xl flex items-center justify-center mx-auto mb-6 text-white shadow-lg shadow-rose-100"><Icon name="upload" size={32} /></div>
                                <h2 className="text-2xl font-black mb-2 uppercase tracking-tighter text-slate-800">Carga de Lista</h2>
                                <button onClick={() => globalFileInputRef.current.click()} className="w-full bg-slate-900 hover:bg-black text-white py-4 rounded-2xl font-black tracking-widest uppercase text-xs active:scale-95 transition-all">Seleccionar Archivo</button>
                            </div>
                        ) : (
                            <div className="space-y-6 animate-in fade-in duration-300">
                                {view === 'scanner' ? (
                                    <div className="max-w-md mx-auto relative aspect-square bg-black rounded-[2.5rem] overflow-hidden border-8 border-white shadow-2xl">
                                        <div id="reader" className="w-full h-full grayscale-[0.3]"></div>
                                        <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                            <div className="w-64 h-64 border-2 border-white/30 rounded-3xl relative">
                                                <div className="absolute inset-x-0 h-1 bg-rose-500/50 shadow-[0_0_15px_rgba(244,63,94,0.8)] scan-line"></div>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <>
                                        <div className="flex flex-col md:flex-row gap-4 justify-between items-center">
                                            <div className="relative w-full md:w-96">
                                                <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"><Icon name="search" size={16} /></div>
                                                <input type="text" placeholder="Buscar..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-12 pr-4 py-3 bg-white border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-rose-50 text-sm font-bold shadow-sm" />
                                            </div>
                                            <button onClick={() => setShowMassSendConfirm(true)} className="w-full md:w-auto bg-rose-500 hover:bg-rose-600 text-white px-6 py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-lg flex items-center justify-center space-x-2 transition-all active:scale-95"><Icon name="send" size={14}/><span>Envío Masivo</span></button>
                                        </div>

                                        <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden overflow-x-auto custom-scrollbar">
                                            <table className="w-full text-left">
                                                <thead>
                                                    <tr className="bg-slate-50 border-b border-slate-200 text-slate-400 uppercase font-black text-[9px] tracking-widest">
                                                        <th className="px-6 py-5">ID</th>
                                                        <th className="px-6 py-5">Persona</th>
                                                        <th className="px-6 py-5">Contacto</th>
                                                        <th className="px-6 py-5 text-center">Status</th>
                                                        <th className="px-6 py-5 text-center">Acciones</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {filteredData.map(g => (
                                                        <tr key={g.id} className="hover:bg-slate-50/50 transition-colors group">
                                                            <td className="px-6 py-4 font-mono text-xs font-bold text-rose-600 uppercase tracking-tighter">{g.id}</td>
                                                            <td className="px-6 py-4 font-bold text-sm text-slate-700 leading-tight truncate max-w-[150px]">{g.nombre}</td>
                                                            <td className="px-6 py-4 font-mono text-xs text-slate-500 tracking-tighter leading-none">{g.contacto}</td>
                                                            <td className="px-6 py-4 text-center">
                                                                <span className={`px-3 py-1 rounded-full text-[9px] font-black uppercase border ${g.status === 'Validado' ? 'bg-emerald-50 text-emerald-700 border-emerald-100' : 'bg-amber-50 text-amber-700 border-amber-100'}`}>{g.status}</span>
                                                            </td>
                                                            <td className="px-6 py-4 text-center">
                                                                <div className="flex items-center justify-center space-x-2">
                                                                    <button onClick={() => setSelectedGuest(g)} className="p-2 rounded-xl bg-slate-50 text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition-all shadow-sm" title="Detalles"><Icon name="qr-code" size={14}/></button>
                                                                    <button onClick={() => setConfirmModal({ show: true, guest: g })} className="p-2 rounded-xl bg-emerald-50 text-emerald-500 hover:bg-emerald-600 hover:text-white transition-all shadow-sm" title="Enviar WhatsApp"><Icon name="message-square" size={14}/></button>
                                                                    {g.status !== 'Validado' && (
                                                                        <button onClick={() => setManualValidateModal({ show: true, guest: g })} className="p-2 rounded-xl bg-rose-50 text-rose-500 hover:bg-rose-600 hover:text-white transition-all shadow-sm" title="Validar Manualmente"><Icon name="user-check" size={14}/></button>
                                                                    )}
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </>
                                )}
                            </div>
                        )}
                    </main>

                    {/* MODALES DE CONFIRMACIÓN */}
                    {manualValidateModal.show && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-200">
                            <div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-sm p-8 text-center animate-in zoom-in-95 duration-200">
                                <div className="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="user-check" size={32}/></div>
                                <h3 className="text-xl font-black mb-2 uppercase tracking-tighter text-slate-800 text-center">¿Validar Asistencia?</h3>
                                <p className="text-slate-500 text-sm mb-8 leading-relaxed">Confirmar ingreso manual para: <br/><strong>{manualValidateModal.guest?.nombre}</strong></p>
                                <div className="flex flex-col space-y-3">
                                    <button onClick={() => validateGuest(manualValidateModal.guest?.id)} className="w-full bg-rose-600 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest shadow-lg active:scale-95 transition-all">SÍ, VALIDAR INGRESO</button>
                                    <button onClick={() => setManualValidateModal({ show: false, guest: null })} className="w-full text-slate-400 font-bold text-xs uppercase tracking-widest hover:text-slate-600 transition-colors py-2 text-center">Cancelar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {confirmModal.show && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-200">
                            <div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-sm p-8 text-center animate-in zoom-in-95 duration-200">
                                <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="message-square" size={32}/></div>
                                <h3 className="text-xl font-black mb-2 uppercase tracking-tighter text-slate-800 text-center">¿Enviar Invitación?</h3>
                                <p className="text-slate-500 text-sm mb-8 leading-relaxed">Enviar a <strong>{confirmModal.guest?.nombre}</strong>.</p>
                                <div className="flex flex-col space-y-3">
                                    <button onClick={() => handleSingleSend(confirmModal.guest)} className="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest shadow-lg active:scale-95 transition-all">SÍ, ENVIAR</button>
                                    <button onClick={() => setConfirmModal({ show: false, guest: null })} className="w-full text-slate-400 font-bold text-xs uppercase tracking-widest hover:text-slate-600 transition-colors py-2 text-center">Cancelar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Notificación Automática */}
                    {notification.show && (
                        <div className={`fixed top-6 left-1/2 -translate-x-1/2 z-[100] w-[90%] max-w-sm ${notification.exiting ? 'notification-fade-out' : 'notification-fade-in'}`}>
                            <div className={`p-4 rounded-2xl shadow-2xl border-l-8 flex items-start space-x-4 bg-white ${notification.type === 'success' ? 'border-emerald-500' : 'border-rose-500'}`}>
                                <div className={`p-2 rounded-lg shrink-0 ${notification.type === 'success' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}`}>
                                    <Icon name={notification.type === 'success' ? 'check-circle' : 'alert-circle'} size={24} />
                                </div>
                                <div className="flex-1 min-w-0 text-left">
                                    <h4 className="font-black text-sm text-slate-800 uppercase tracking-tighter leading-none">{notification.title}</h4>
                                    <p className="text-[10px] text-slate-500 mt-1.5 leading-relaxed truncate">{notification.message}</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {isSending && (
                        <div className="fixed inset-0 z-[100] bg-white/95 backdrop-blur-md flex flex-col items-center justify-center text-center p-6">
                            <div className="animate-spin text-rose-600 mb-4"><Icon name="loader-2" size={48} /></div>
                            <h2 className="text-xl font-black uppercase tracking-tighter text-slate-800 tracking-widest">Enviando...</h2>
                            <p className="font-mono text-[10px] text-rose-600 bg-rose-50 px-6 py-3 rounded-xl border border-rose-100 max-w-xs font-bold mt-2 truncate">{sendProgress.status}</p>
                            <p className="mt-4 text-[9px] font-black text-slate-400 uppercase tracking-widest">Paso {sendProgress.current} de {sendProgress.total}</p>
                        </div>
                    )}

                    {/* Modal Ajustes API */}
                    {showApiConfig && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm" onClick={() => setShowApiConfig(false)}>
                            <div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-sm p-8 relative animate-in zoom-in-95 duration-200" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setShowApiConfig(false)} className="absolute top-6 right-6 text-slate-400 hover:text-slate-600 transition-colors"><Icon name="x" size={20}/></button>
                                <h3 className="text-xl font-black mb-6 uppercase tracking-tight text-slate-800">Ajustes API</h3>
                                <div className="space-y-4 text-left">
                                    {['apiUrl', 'idInstance', 'apiTokenInstance'].map(k => (
                                        <div key={k}>
                                            <label className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1 block">{k}</label>
                                            <input type={k.includes('Token') ? 'password' : 'text'} value={greenApiCreds[k]} onChange={e => setGreenApiCreds({...greenApiCreds, [k]: e.target.value})} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-mono text-xs focus:ring-2 focus:ring-rose-500 transition-all" />
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => setShowApiConfig(false)} className="w-full mt-6 bg-slate-900 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest shadow-lg active:scale-95 transition-all">Guardar</button>
                            </div>
                        </div>
                    )}

                    {showMassSendConfirm && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm" onClick={() => setShowMassSendConfirm(false)}>
                            <div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-sm p-10 text-center animate-in zoom-in-95" onClick={e => e.stopPropagation()}>
                                <div className="w-16 h-16 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner"><Icon name="send" size={32}/></div>
                                <h3 className="text-xl font-black mb-2 uppercase tracking-tighter text-slate-800">¿Enviar a todos?</h3>
                                <p className="text-slate-500 text-sm mb-8 leading-relaxed font-medium uppercase text-[10px] tracking-wider text-center">Se enviarán las invitaciones con QR a los {data.length} registrados.</p>
                                <button onClick={handleMassSend} className="w-full bg-rose-500 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest shadow-lg active:scale-95 transition-all">SÍ, ENVIAR AHORA</button>
                                <button onClick={() => setShowMassSendConfirm(false)} className="w-full text-slate-400 font-bold text-xs uppercase tracking-widest hover:text-slate-600 transition-colors py-2 text-center">Cancelar</button>
                            </div>
                        </div>
                    )}

                    {selectedGuest && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm" onClick={() => setSelectedGuest(null)}>
                            <div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-sm p-8 flex flex-col items-center animate-in zoom-in-95 duration-200" onClick={e => e.stopPropagation()}>
                                <div className="bg-slate-50 p-6 rounded-[2rem] border border-slate-100 mb-6 shadow-inner w-full flex justify-center"><img src={selectedGuest.qrUrl} className="w-48 h-48 rounded-2xl shadow-sm" alt="QR" /></div>
                                <div className="w-full space-y-4 mb-6 text-center">
                                    <h3 className="text-lg font-black uppercase tracking-tighter text-slate-800 leading-tight">{selectedGuest.nombre}</h3>
                                    <p className="text-rose-600 font-black tracking-widest uppercase text-xs mt-1 leading-none">{selectedGuest.id}</p>
                                    <div className="bg-slate-50 rounded-2xl p-4 border border-slate-100 space-y-2 mt-4 text-left">
                                        <div className="flex justify-between items-center leading-none"><span className="text-[8px] font-black text-slate-400 uppercase">WhatsApp:</span><span className="text-[10px] font-bold text-slate-700 font-mono tracking-tighter leading-none">{selectedGuest.contacto}</span></div>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-3 w-full">
                                    <button onClick={() => { const g = selectedGuest; setSelectedGuest(null); setConfirmModal({ show: true, guest: g }); }} className="bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-lg active:scale-95 flex items-center justify-center space-x-2 transition-all"><Icon name="message-square" size={14} /><span>Enviar</span></button>
                                    <button onClick={() => setSelectedGuest(null)} className="bg-slate-100 hover:bg-slate-200 text-slate-400 py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest active:scale-95 transition-all text-center">Cerrar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {scannerResult && (
                        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4 bg-slate-900/90 backdrop-blur-md" onClick={() => setScannerResult(null)}>
                            <div className="bg-white rounded-[2.5rem] w-full max-w-sm overflow-hidden animate-in slide-in-from-bottom duration-300 shadow-2xl" onClick={e => e.stopPropagation()}>
                                <div className={`p-10 text-center text-white shadow-inner ${scannerResult.status === 'Validado' ? 'bg-amber-600' : 'bg-rose-600'}`}>
                                    <div className="mx-auto w-20 h-20 rounded-3xl flex items-center justify-center mb-4 bg-white/20 text-white">
                                        <Icon name={scannerResult.status === 'Validado' ? "alert-circle" : "check-circle-2"} size={40}/>
                                    </div>
                                    <h3 className="text-2xl font-black uppercase tracking-tight leading-tight">
                                        {scannerResult.status === 'Validado' ? 'Ya Validado' : 'Acceso Válido'}
                                    </h3>
                                    <p className="opacity-70 font-mono text-sm mt-1 uppercase tracking-widest leading-none">{scannerResult.id}</p>
                                </div>
                                <div className="p-8 space-y-6">
                                    <div className="bg-slate-50 p-6 rounded-2xl border border-slate-100 shadow-sm text-left">
                                        <p className="text-[10px] font-black text-slate-400 uppercase mb-1">Persona</p>
                                        <p className="text-sm font-bold text-slate-800 leading-tight">{scannerResult.nombre}</p>
                                    </div>
                                    {scannerResult.status === 'Validado' ? (
                                        <div className="bg-amber-50 border-2 border-amber-200 p-5 rounded-[1.5rem] text-center">
                                            <p className="text-amber-800 font-black text-xs uppercase tracking-tighter">Este invitado ya ha sido validado anteriormente.</p>
                                        </div>
                                    ) : (
                                        <button onClick={() => validateGuest(scannerResult.id)} className="w-full bg-rose-600 text-white py-5 rounded-[1.5rem] font-black text-lg shadow-xl uppercase tracking-tighter active:scale-95 transition-all">CONFIRMAR ENTRADA</button>
                                    )}
                                    <button onClick={() => setScannerResult(null)} className="w-full text-slate-400 font-bold text-[10px] uppercase tracking-widest py-2 text-center hover:text-slate-600">Volver</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
